<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Certificates — Riel</title>
  <meta name="description" content="Koleksi sertifikat dan kredensial A. Choiril Anwar El-Asfihani Risydan." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/icons/favicon_128x128.png" />

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <link rel="stylesheet" href="./styles/dock.css" />
  <link rel="stylesheet" href="./styles/certificates.css" />
  <meta name="theme-color" content="#0C0C0C" />
</head>
<body>

  <canvas id="splash-canvas"></canvas>
  <nav id="floating-dock"></nav>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="cert-main">

    <!-- Header -->
    <div class="cert-page-header">
      <a href="./index.html" class="cert-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Home
      </a>

      <div class="cert-page-meta">
        <div class="cert-page-meta__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="7"/><polyline points="9 14.2 12 22 15 14.2"/><polyline points="9.6 14.6 12 17 14.4 14.6"/></svg>
        </div>
        <span class="cert-page-meta__path">~/certificates</span>
      </div>

      <h1 class="cert-page-title">Certificates</h1>
      <p class="cert-page-desc">Kumpulan sertifikat dan pengakuan dari berbagai program, organisasi, dan kegiatan.</p>

      <!-- Filter pills -->
      <div class="cert-filter-bar" id="cert-filter-bar"><!-- diisi JS --></div>
    </div>

    <!-- Grid cards -->
    <div class="cert-grid" id="cert-grid">
      <!-- diisi JS -->
    </div>

  </main>

  <!-- ══ LIGHTBOX MODAL ══ -->
  <div class="cert-modal" id="cert-modal" role="dialog" aria-modal="true" aria-label="Preview sertifikat" hidden>
    <div class="cert-modal__backdrop" id="modal-backdrop"></div>
    <div class="cert-modal__container">

      <!-- Counter -->
      <div class="cert-modal__counter" id="modal-counter">01 / 04</div>

      <!-- Tombol prev -->
      <button class="cert-modal__nav cert-modal__nav--prev" id="modal-prev" aria-label="Sebelumnya">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <!-- Preview area -->
      <div class="cert-modal__preview" id="modal-preview">
        <!-- canvas PDF / img -->
      </div>

      <!-- Tombol close -->
      <button class="cert-modal__close" id="modal-close" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <!-- Tombol next -->
      <button class="cert-modal__nav cert-modal__nav--next" id="modal-next" aria-label="Berikutnya">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <!-- Info sertifikat -->
      <div class="cert-modal__info" id="modal-info">
        <p class="cert-modal__info-title" id="modal-title">—</p>
        <p class="cert-modal__info-sub"   id="modal-sub">—</p>
        <a class="cert-modal__doc-link" id="modal-doc-link" href="#" target="_blank" rel="noreferrer">Buka dokumen</a>
      </div>

      <!-- Hint navigasi -->
      <div class="cert-modal__hint">
        <span><kbd>←</kbd> <kbd>→</kbd> Navigate</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>

    </div>
  </div>

  <script type="module" src="./js/certificates.js"></script>
</body>
</html>
